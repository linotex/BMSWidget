name: BMSWidget

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""          # Team ID for signing in Xcode; tools/build.sh signs ad-hoc instead
    BUNDLE_PREFIX: io.github.linotex    # reverse-DNS prefix you control (also read by tools/build.sh)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  BMSWidget:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - target: BMSWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).bmswidget
        PRODUCT_NAME: BMSWidget
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: BMS Widget
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: Потрібен, щоб зчитувати стан акумулятора з BMS.
    entitlements:
      path: Support/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/BMSWidget/

  BMSWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).bmswidget.widget
        PRODUCT_NAME: BMSWidgetExtension
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: BMS Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/BMSWidget/
